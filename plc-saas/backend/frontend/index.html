<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLCSmart – Đăng nhập</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563eb%27/%3E%3Cpath d=%27M17.5 5 9 18h6l-1.5 9L22 14h-6z%27 fill=%27white%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',sans-serif;background:#0a0e1a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.025) 2px,rgba(0,0,0,0.025) 4px);pointer-events:none;}

.bg-glow{position:fixed;top:20%;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(0,100,200,0.15),transparent 70%);pointer-events:none;}

.card{background:#111827;border:1px solid #1f2a3d;border-radius:12px;padding:40px;width:100%;max-width:420px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
.card::before{display:none;}

.logo{text-align:center;margin-bottom:32px;}
.logo-icon{width:44px;height:44px;border-radius:10px;background:#2563eb;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.logo-title{font-size:24px;font-weight:700;letter-spacing:-0.5px;color:#f1f5f9;}
.logo-sub{font-size:11px;color:#94a3b8;letter-spacing:2px;margin-top:4px;}

.tabs{display:flex;background:#0a0e1a;border:1px solid #1f2a3d;border-radius:8px;padding:4px;margin-bottom:24px;gap:4px;}
.tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:700;letter-spacing:1px;color:#94a3b8;cursor:pointer;border-radius:6px;transition:all .2s;text-transform:uppercase;}
.tab.active{background:#151c30;color:#3b82f6;}

.field{margin-bottom:16px;}
.label{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;display:block;}
.input{width:100%;background:#151c30;border:1px solid #2b3a52;border-radius:6px;color:#f1f5f9;font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 14px;outline:none;transition:all .2s;}
.input:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,0.1);}

.btn{width:100%;background:#2563eb;border:none;border-radius:7px;color:#fff;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;letter-spacing:2px;padding:13px;text-transform:uppercase;transition:all .2s;margin-top:8px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,0.3);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}

.error{background:rgba(255,61,61,0.1);border:1px solid rgba(255,61,61,0.3);border-radius:6px;color:#ff8a80;font-size:12px;padding:10px 14px;margin-bottom:16px;display:none;}
.success{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);border-radius:6px;color:#00e676;font-size:12px;padding:10px 14px;margin-bottom:16px;display:none;}

.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;}
.plan-card{background:#0a0e1a;border:1px solid #1f2a3d;border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all .2s;}
.plan-card:hover,.plan-card.selected{border-color:#3b82f6;background:#151c30;}
.plan-name{font-size:13px;font-weight:700;color:#3b82f6;letter-spacing:1px;}
.plan-price{font-size:11px;color:#94a3b8;margin-top:2px;}
.plan-limit{font-size:10px;color:#4ec9b0;margin-top:4px;}

.divider{display:flex;align-items:center;gap:10px;margin:20px 0;color:#94a3b8;font-size:11px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#1f2a3d;}

.footer{text-align:center;margin-top:20px;font-size:11px;color:#94a3b8;}
.footer a{color:#3b82f6;text-decoration:none;}
</style>
</head>
<body>
<div class="bg-glow"></div>

<div class="card">
  <div class="logo">
    <a href="/" style="text-decoration:none"><div class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
    <div class="logo-title">PLCSmart</div></a>
    <div class="logo-sub">SIEMENS · MITSUBISHI · ALLEN BRADLEY</div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Đăng Nhập</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">Đăng Ký</div>
  </div>

  <div id="msg-error" class="error"></div>
  <div id="msg-success" class="success"></div>

  <!-- Login Form -->
  <div id="form-login">
    <div class="field">
      <label class="label">Email</label>
      <input class="input" type="email" id="login-email" placeholder="your@email.com">
    </div>
    <div class="field">
      <label class="label">Mật khẩu</label>
      <input class="input" type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="btn-login" onclick="doLogin()">Đăng nhập</button>
  </div>

  <!-- Register Form -->
  <div id="form-register" style="display:none;">
    <div class="field">
      <label class="label">Họ tên</label>
      <input class="input" type="text" id="reg-name" placeholder="Nguyễn Văn A">
    </div>
    <div class="field">
      <label class="label">Email</label>
      <input class="input" type="email" id="reg-email" placeholder="your@email.com">
    </div>
    <div class="field">
      <label class="label">Mật khẩu</label>
      <input class="input" type="password" id="reg-pass" placeholder="Ít nhất 6 ký tự">
    </div>

    <div class="divider">Tài khoản mới bắt đầu với gói Free — nâng cấp bất cứ lúc nào</div>
    <div class="plans">
      <div class="plan-card selected" id="plan-free" onclick="selectPlan('free')">
        <div class="plan-name">FREE</div>
        <div class="plan-price">Miễn phí</div>
        <div class="plan-limit">10 lần/tháng</div>
      </div>
      <div class="plan-card" id="plan-pro" onclick="selectPlan('pro')">
        <div class="plan-name">PRO</div>
        <div class="plan-price">$19/tháng</div>
        <div class="plan-limit">100 lần/tháng</div>
      </div>
      <div class="plan-card" id="plan-enterprise" onclick="selectPlan('enterprise')">
        <div class="plan-name">ENTERPRISE</div>
        <div class="plan-price">$99/tháng</div>
        <div class="plan-limit">Không giới hạn</div>
      </div>
    </div>

    <button class="btn" id="btn-register" onclick="doRegister()">Tạo tài khoản</button>
  </div>
  <div class="footer">Bằng việc tiếp tục, bạn đồng ý với <a href="/terms">Điều khoản</a> và <a href="/privacy">Chính sách bảo mật</a>.</div>
</div>

<script>
const API = window.location.origin + '/api';
let selectedPlan = 'free';
if(location.pathname==='/register') setTimeout(()=>switchTab('register'),0);

function switchTab(t) {
  document.getElementById('form-login').style.display = t==='login'?'block':'none';
  document.getElementById('form-register').style.display = t==='register'?'block':'none';
  document.getElementById('tab-login').className = 'tab'+(t==='login'?' active':'');
  document.getElementById('tab-register').className = 'tab'+(t==='register'?' active':'');
  hideMsg();
}

function selectPlan(plan) {
  selectedPlan = plan;
  ['free','pro','enterprise'].forEach(p => {
    document.getElementById('plan-'+p).className = 'plan-card' + (p===plan?' selected':'');
  });
}

function showError(msg) {
  const el=document.getElementById('msg-error');
  el.textContent=msg; el.style.display='block';
  document.getElementById('msg-success').style.display='none';
}
function showSuccess(msg) {
  const el=document.getElementById('msg-success');
  el.textContent=msg; el.style.display='block';
  document.getElementById('msg-error').style.display='none';
}
function hideMsg() {
  document.getElementById('msg-error').style.display='none';
  document.getElementById('msg-success').style.display='none';
}

async function doLogin() {
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showError('Vui lòng nhập đầy đủ thông tin');return;}
  
  const btn=document.getElementById('btn-login');
  btn.disabled=true; btn.textContent='Đang đăng nhập...';
  
  try {
    const res = await fetch(`${API}/auth/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail||'Lỗi đăng nhập');
    
    localStorage.setItem('plc_token', data.token);
    localStorage.setItem('plc_user', JSON.stringify(data.user));
    showSuccess('Đăng nhập thành công! Đang chuyển hướng...');
    
    setTimeout(() => {
      if(data.user.is_admin) window.location.href='/admin';
      else window.location.href='/app';
    }, 800);
  } catch(e) {
    showError(e.message);
  } finally {
    btn.disabled=false; btn.textContent='Đăng nhập';
  }
}

async function doRegister() {
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const pass=document.getElementById('reg-pass').value;
  if(!email||!pass){showError('Vui lòng nhập Email và Mật khẩu');return;}
  
  const btn=document.getElementById('btn-register');
  btn.disabled=true; btn.textContent='Đang tạo tài khoản...';
  
  try {
    const res = await fetch(`${API}/auth/register`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass, full_name: name})
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail||'Lỗi đăng ký');
    
    localStorage.setItem('plc_token', data.token);
    showSuccess('Đăng ký thành công! Đang chuyển hướng...');
    setTimeout(() => window.location.href='/app', 800);
  } catch(e) {
    showError(e.message);
  } finally {
    btn.disabled=false; btn.textContent='Tạo tài khoản';
  }
}

// Auto redirect if already logged in
const token = localStorage.getItem('plc_token');
if(token) window.location.href='/app';
</script>
</body>
</html>
